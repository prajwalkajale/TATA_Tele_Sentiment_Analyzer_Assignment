services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom-sentiment-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/analyze-sentiment}
      DATABASE_URL: postgres://user:password@postgres:5432/sentiment_db
    depends_on:
      - n8n
      - postgres
    networks:
      - sentiment-network

  n8n:
    image: n8nio/n8n:latest
    container_name: telecom-sentiment-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sentiment-network

  postgres:
    image: postgres:16-alpine
    container_name: telecom-sentiment-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentiment_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentiment-network

networks:
  sentiment-network:
    driver: bridge

volumes:
  n8n_data:
  postgres_data:
